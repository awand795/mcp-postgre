version: '3.8'

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "darkoRedis2024", "--appendonly", "no"]
    volumes:
      - redis_data:/data
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      restart_policy:
        condition: any

  app:
    image: awandadarkotech/darkoai:latest
    depends_on:
      - redis
    ports:
      - "5000:5000"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:5000
    env_file:
      - .env
    stop_grace_period: 30m
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
      update_config:
        parallelism: 1
        delay: 15s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any

volumes:
  redis_data:
