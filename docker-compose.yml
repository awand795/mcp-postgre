version: '3.8'

services:
  app:
    image: awand795/darkoai:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_URL=http://localhost:8000
    env_file:
      - .env
    volumes:
      - ./.env:/var/www/.env
